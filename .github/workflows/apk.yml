name: APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK yig'ish
        run: gradle :app:assembleDebug --no-daemon

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/debug/app-debug.apk AvtoSkaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AvtoSkaner
          path: AvtoSkaner.apk

      - name: Yuklab olish sahifasiga qo'yish (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4-build${{ github.run_number }}
          name: Avto Skaner v0.4 (yig'ish ${{ github.run_number }})
          body: Telefonga yuklab olib o'rnating. "Noma'lum manbalardan o'rnatish"ga ruxsat bering.
          files: AvtoSkaner.apk
